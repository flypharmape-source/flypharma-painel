// ── ENTREGADORES ──────────────────────────────────────────────
var ENTREGADORES = [];
function loadEntregadores() {
  if (!CU || CU.role !== 'admin') { ENTREGADORES = []; return Promise.resolve(); }
  return apiFetch('/admin/entregadores').then(function(res) {
    if (res.ok && Array.isArray(res.data)) ENTREGADORES = res.data;
    else ENTREGADORES = [];
    var pendentes = ENTREGADORES.filter(function(e){ return e.status_entregador === 'pendente'; }).length;
    var bdg = document.getElementById('bdg-entr');
    if (bdg) { bdg.textContent = pendentes; bdg.style.display = pendentes > 0 ? 'flex' : 'none'; }
  }).catch(function() { ENTREGADORES = []; });
}

function renderEntregadores() {
  var el = document.getElementById('page-entr');
  if (!el) return;
  var filtro = window._entrFiltro || 'pendente';
  var filtrados = filtro === 'todos' ? ENTREGADORES : ENTREGADORES.filter(function(e){ return e.status_entregador === filtro; });

  var statusLabel = {
    pendente:  '<span class="b pend">⏳ Pendente</span>',
    aprovado:  '<span class="b cok">✅ Aprovado</span>',
    reprovado: '<span class="b" style="background:#fee;color:#c00">❌ Reprovado</span>',
  };

  // Total a repassar na semana (soma de TODOS os entregadores, não só os filtrados)
  var totalRepasse = ENTREGADORES.reduce(function(s,e){ return s + (Number(e.ganhos_semana)||0); }, 0);
  var totalEntregasSemana = ENTREGADORES.reduce(function(s,e){ return s + (Number(e.entregas_semana)||0); }, 0);

  var h2 = '';
  if (totalRepasse > 0 || totalEntregasSemana > 0) {
    h2 += '<div style="background:linear-gradient(135deg,#18A065,#22C97A);border-radius:14px;padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;color:#fff;box-shadow:0 6px 20px rgba(34,201,122,.25)">';
    h2 += '<div><div style="font-size:12px;font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:.5px">Total a repassar esta semana</div>';
    h2 += '<div style="font-size:28px;font-weight:800;margin-top:2px">R$ '+totalRepasse.toFixed(2).replace('.',',')+'</div></div>';
    h2 += '<div style="text-align:right"><div style="font-size:22px;font-weight:800">'+totalEntregasSemana+'</div><div style="font-size:11px;opacity:.9">entregas · desde segunda</div></div>';
    h2 += '</div>';
  }
  h2 += '<div class="fb">';
  var filtros2 = ['pendente','aprovado','reprovado','todos'];
  var labels2 = {pendente:'Pendentes ('+ENTREGADORES.filter(function(e){return e.status_entregador==='pendente';}).length+')',aprovado:'Aprovados',reprovado:'Reprovados',todos:'Todos ('+ENTREGADORES.length+')'};
  filtros2.forEach(function(f) {
    h2 += '<button class="fc' + (filtro===f?' on':'') + '" onclick="window._entrFiltro=\'' + f + '\';renderEntregadores()">' + labels2[f] + '</button>';
  });
  h2 += '</div>';

  if (filtrados.length === 0) {
    h2 += '<div style="padding:60px;text-align:center"><div style="font-size:48px;margin-bottom:12px">🛵</div><div style="color:var(--t2);font-size:14px">Nenhum entregador nesta categoria</div></div>';
  } else {
    h2 += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">';
    filtrados.forEach(function(e) {
      h2 += '<div class="card" style="padding:16px">';
      h2 += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">';
      if (e.foto_rosto) {
        h2 += '<img src="'+e.foto_rosto+'" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--br)">';
      } else {
        h2 += '<div style="width:52px;height:52px;border-radius:50%;background:var(--t);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--n)">'+e.nome[0]+'</div>';
      }
      h2 += '<div style="flex:1"><div style="font-weight:700;color:var(--n)">'+e.nome+'</div>';
      h2 += '<div style="font-size:12px;color:var(--t3)">'+e.email+'</div>';
      h2 += '<div style="font-size:12px;color:var(--t3)">📱 '+(e.telefone||'—')+'</div></div>';
      h2 += statusLabel[e.status_entregador] || e.status_entregador;
      h2 += '</div>';

      // Dados da moto
      if (e.placa_moto || e.modelo_moto) {
        h2 += '<div style="background:var(--tl);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px">';
        h2 += '🏍️ '+(e.modelo_moto||'—')+' · Placa: '+(e.placa_moto||'—');
        h2 += '</div>';
      }

      // Ganhos da semana (para o repasse)
      h2 += '<div style="background:rgba(34,201,122,.12);border:1px solid rgba(34,201,122,.25);border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between">';
      h2 += '<div><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Ganhos da semana</div>';
      h2 += '<div style="font-size:18px;font-weight:800;color:#18A065">R$ '+Number(e.ganhos_semana||0).toFixed(2).replace('.',',')+'</div></div>';
      h2 += '<div style="text-align:right;font-size:12px;color:var(--t2)">'+(Number(e.entregas_semana)||0)+' entrega'+((Number(e.entregas_semana)||0)===1?'':'s')+'<br><span style="font-size:10px;color:var(--t3)">desde segunda</span></div>';
      h2 += '</div>';

      // Documentos
      h2 += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
      if (e.cnh_frente) h2 += '<img src="'+e.cnh_frente+'" style="height:60px;border-radius:6px;cursor:zoom-in;border:1px solid var(--br)" onclick="openLightbox(this.src)" title="CNH Frente">';
      if (e.cnh_verso)  h2 += '<img src="'+e.cnh_verso+'"  style="height:60px;border-radius:6px;cursor:zoom-in;border:1px solid var(--br)" onclick="openLightbox(this.src)" title="CNH Verso">';
      if (e.crlv)       h2 += '<img src="'+e.crlv+'"       style="height:60px;border-radius:6px;cursor:zoom-in;border:1px solid var(--br)" onclick="openLightbox(this.src)" title="CRLV">';
      if (e.foto_moto)  h2 += '<img src="'+e.foto_moto+'"  style="height:60px;border-radius:6px;cursor:zoom-in;border:1px solid var(--br)" onclick="openLightbox(this.src)" title="Foto da moto">';
      h2 += '</div>';

      if (e.obs_admin) h2 += '<div style="font-size:12px;color:var(--t2);margin-bottom:10px;padding:8px;background:#fff8e1;border-radius:6px">📝 '+e.obs_admin+'</div>';

      // Ações
      if (e.status_entregador === 'pendente') {
        h2 += '<div style="display:flex;gap:8px">';
        h2 += '<button class="btn btn-p" style="flex:1;justify-content:center" onclick="aprovarEntregador(\'' + e.id + '\')">✅ Aprovar</button>';
        h2 += '<button class="btn btn-d" style="flex:1;justify-content:center" onclick="reprovarEntregador(\'' + e.id + '\')">❌ Reprovar</button>';
        h2 += '</div>';
      } else if (e.status_entregador === 'aprovado') {
        h2 += '<button class="btn btn-d" style="width:100%;justify-content:center" onclick="reprovarEntregador(\'' + e.id + '\')">🚫 Suspender</button>';
      } else {
        h2 += '<button class="btn btn-p" style="width:100%;justify-content:center" onclick="aprovarEntregador(\'' + e.id + '\')">✅ Reativar</button>';
      }
      h2 += '</div>';
    });
    h2 += '</div>';
  }
  el.innerHTML = h2;
}

function aprovarEntregador(id) {
  if (!confirm('Aprovar este entregador?')) return;
  apiFetch('/admin/entregadores/' + id + '/aprovar', { method: 'PATCH' }).then(function(res) {
    if (res.ok) { showToast('s','Entregador aprovado!','Ele já pode receber pedidos.'); loadEntregadores().then(renderEntregadores); }
    else showToast('e','Erro', res.data.error || 'Tente novamente');
  });
}

function reprovarEntregador(id) {
  var motivo = prompt('Motivo da reprovação (opcional):');
  if (motivo === null) return;
  apiFetch('/admin/entregadores/' + id + '/reprovar', { method: 'PATCH', body: JSON.stringify({ motivo: motivo }) }).then(function(res) {
    if (res.ok) { showToast('s','Entregador reprovado','Notificação enviada.'); loadEntregadores().then(renderEntregadores); }
    else showToast('e','Erro', res.data.error || 'Tente novamente');
  });
}

// ── MANIPULADOS ───────────────────────────────────────────────
var MANIPS = [];
function loadManip() {
  var isAdm = CU && CU.role === 'admin';
  var farmId = CU && CU.farmacia_id;
  var url = farmId ? ('/farmacias/' + farmId + '/manipulados') : null;
  if (!url) { MANIPS = []; updateBadgeManip(); return Promise.resolve(); }
  return apiFetch(url).then(function(res) {
    if (res.ok && Array.isArray(res.data)) {
      MANIPS = res.data;
    } else { MANIPS = []; }
    updateBadgeManip();
  }).catch(function() { MANIPS = []; });
}
function updateBadgeManip() {
  var pendentes = MANIPS.filter(function(m){ return m.status === 'aguardando_orcamento'; }).length;
  var bdg = document.getElementById('bdg-manip');
  if (bdg) { bdg.textContent = pendentes; bdg.style.display = pendentes > 0 ? 'flex' : 'none'; }
}
function renderManip() {
  var el = document.getElementById('page-manip');
  if (!el) return;
  var myFarmId = CU && CU.farmacia_id;
  var MANIPS_SHOW = myFarmId ? MANIPS.filter(function(m){ return m.farmacia_id === myFarmId; }) : MANIPS;
  var filtro = window._manipFiltro || 'todos';
  var filtrados = filtro === 'todos' ? MANIPS_SHOW : MANIPS_SHOW.filter(function(m){ return m.status === filtro; });

  var statusLabel = {
    aguardando_orcamento: '<span class="b pend">Aguardando orçamento</span>',
    orcamento_enviado:    '<span class="b prep">Orçamento enviado</span>',
    orcamento_aprovado:   '<span class="b cok">Aprovado</span>',
    orcamento_recusado:   '<span class="b btn-d" style="color:#fff">Recusado</span>',
  };

  var h = '<div class="fb">';
  var filtros = ['todos','aguardando_orcamento','orcamento_enviado','orcamento_aprovado','orcamento_recusado'];
  var labels = {todos:'Todos ('+MANIPS_SHOW.length+')',aguardando_orcamento:'Aguardando',orcamento_enviado:'Enviados',orcamento_aprovado:'Aprovados',orcamento_recusado:'Recusados'};
  filtros.forEach(function(f) {
    h += '<button class="fc' + (filtro===f?' on':'') + '" onclick="window._manipFiltro=\'' + f + '\';renderManip()">' + labels[f] + '</button>';
  });
  h += '</div>';

  if (filtrados.length === 0) {
    h += '<div style="padding:60px;text-align:center"><div style="font-size:48px;margin-bottom:12px">🧪</div><div style="color:var(--t2);font-size:14px">Nenhuma solicitação de manipulado</div></div>';
  } else {
    h += '<div class="card"><table class="tbl"><thead><tr><th>Cliente</th><th>Fórmula</th><th>Status</th><th>Preço</th><th>Prazo</th><th>Data</th><th>Ações</th></tr></thead><tbody>';
    filtrados.forEach(function(m) {
      var formula = m.formula.length > 50 ? m.formula.substring(0,50)+'...' : m.formula;
      h += '<tr>';
      h += '<td><strong>' + (m.cliente_nome||'Cliente') + '</strong>' + (m.cliente_tel ? '<br><small style="color:var(--t3)">'+m.cliente_tel+'</small>' : '') + '</td>';
      h += '<td style="max-width:200px;font-size:12px" title="'+m.formula+'">' + formula + '</td>';
      h += '<td>' + (statusLabel[m.status]||m.status) + '</td>';
      h += '<td>' + (m.preco_orcado ? 'R$'+Number(m.preco_orcado).toFixed(2) : '—') + '</td>';
      h += '<td>' + (m.prazo_dias ? m.prazo_dias+' dias' : '—') + '</td>';
      h += '<td style="font-size:11px">' + (m.created_at ? new Date(m.created_at).toLocaleDateString('pt-BR') : '—') + '</td>';
      h += '<td><div style="display:flex;gap:6px">';
      h += '<button class="btn btn-o" style="padding:4px 8px;font-size:12px" onclick="openModal(\'manip-view\',\'' + m.id + '\')">👁️</button>';
      if (m.status === 'aguardando_orcamento') {
        h += '<button class="btn btn-p" style="padding:4px 8px;font-size:12px" onclick="openModal(\'manip-orcamento\',\'' + m.id + '\')">💰 Orçar</button>';
      }
      h += '</div></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  el.innerHTML = h;

function buildChart(id) {
  // Pedidos reais por dia da semana (últimos 7 dias)
  var days=['Seg','Ter','Qua','Qui','Sex','Sáb','Hj'];
  var vals=[0,0,0,0,0,0,0];
  var hoje2 = new Date(); hoje2.setHours(23,59,59,999);
  for (var pi=0; pi<PEDS.length; pi++) {
    var d = new Date(PEDS[pi].created_at || 0);
    var diff = Math.floor((hoje2 - d) / 86400000);
    if (diff >= 0 && diff < 7) vals[6 - diff]++;
  }
  // Se sem dados, usa valores ilustrativos
  if (vals.every(function(v){return v===0;})) vals=[2,3,1,4,2,3,PEDS.length||1];
  var el = document.getElementById(id); if (!el) return;
  var mx = Math.max.apply(null, vals); el.innerHTML = '';
  for (var i=0;i<vals.length;i++) {
    (function(v,d,last) {
      var w=document.createElement('div'); w.className='bw';
      var b=document.createElement('div'); b.className='bar'+(last?' td':'');
      b.style.height='0'; b.style.flex='1';
      var l=document.createElement('div'); l.className='bL'; l.textContent=d;
      w.appendChild(b); w.appendChild(l); el.appendChild(w);
      setTimeout(function(){b.style.height=Math.round(v/mx*100)+'%';},100+i*60);
    })(vals[i],days[i],i===vals.length-1);
  }
}

// ── CNPJ — Máscara e Validação ────────────────────────────────
function cnpjMask(v) {
  v = (v||'').replace(/\D/g,'').slice(0,14);
  if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,'$1.$2.$3/$4-$5');
  else if (v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/,'$1.$2.$3/$4');
  else if (v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d{0,3}).*/,'$1.$2.$3');
  else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,3}).*/,'$1.$2');
  return v;
}
function maskCNPJ(input) {
  input.value = cnpjMask(input.value);
  validateCNPJField(input);
}
function validateCNPJ(cnpj) {
  cnpj = cnpj.replace(/\D/g,'');
  if (cnpj.length !== 14) return false;
  if (/^(\d)\1+$/.test(cnpj)) return false;
  var calc = function(cnpj, n) {
    var sum = 0, pos = n - 7;
    for (var i = n; i >= 1; i--) {
      sum += parseInt(cnpj.charAt(n - i)) * pos--;
      if (pos < 2) pos = 9;
    }
    var r = sum % 11 < 2 ? 0 : 11 - sum % 11;
    return r === parseInt(cnpj.charAt(n));
  };
  return calc(cnpj, 12) && calc(cnpj, 13);
}
function validateCNPJField(input) {
  var ic = document.getElementById('cnpj-ic');
  if (!ic) return;
  var raw = input.value.replace(/\D/g,'');
  if (raw.length === 14) {
    ic.textContent = '✅'; ic.style.color = 'var(--g)';
  } else if (raw.length > 0) {
    ic.textContent = '❌'; ic.style.color = 'var(--r)';
  } else {
    ic.textContent = '';
  }
}

function previewCSV(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var rows = parseCSV(text);
    if (!rows.length) { document.getElementById('csv-preview').innerHTML = '<p style="color:var(--r)">Arquivo vazio ou inválido.</p>'; return; }
    var header = rows[0].map(function(h){ return h.toLowerCase().trim(); });
    var data = rows.slice(1).filter(function(r){ return r.some(function(c){ return c.trim(); }); });
    var h = '<div style="font-size:12px;font-weight:600;color:var(--g);margin-bottom:8px">✅ ' + data.length + ' produto(s) encontrado(s)</div>';
    h += '<div style="overflow-x:auto;max-height:220px;overflow-y:auto;border:1px solid var(--br);border-radius:8px">';
    h += '<table class="tbl"><thead><tr>';
    header.forEach(function(col){ h += '<th>' + col + '</th>'; });
    h += '</tr></thead><tbody>';
    data.slice(0,8).forEach(function(row){
      h += '<tr>';
      row.forEach(function(cell){ h += '<td style="font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + cell + '">' + cell + '</td>'; });
      h += '</tr>';
    });
    if (data.length > 8) h += '<tr><td colspan="' + header.length + '" style="text-align:center;font-size:11px;color:var(--t3)">... e mais ' + (data.length-8) + ' linha(s)</td></tr>';
    h += '</tbody></table></div>';
    document.getElementById('csv-preview').innerHTML = h;
    window._csvData = {header: header, rows: data};
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  // Normalizar quebras de linha (Windows \r\n e Mac \r)
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  // Detectar separador pela primeira linha
  var firstLine = text.split('\n')[0] || '';
  var commas = (firstLine.match(/,/g) || []).length;
  var semis  = (firstLine.match(/;/g) || []).length;
  var sep = semis > commas ? ';' : ',';
  console.log('[CSV] sep:', JSON.stringify(sep), 'commas:', commas, 'semis:', semis, 'header:', firstLine.slice(0,80));
  return text.split('\n').filter(function(l){ return l.trim(); }).map(function(line){
    var result = [], cur = '', inQ = false;
    for (var i=0; i<line.length; i++) {
      var c = line[i];
      if (c==='"') { inQ=!inQ; continue; }
      if (c===sep && !inQ) { result.push(cur.trim()); cur=''; continue; }
      cur += c;
    }
    result.push(cur.trim());
    return result;
  });
}

function importCSVExecutar(farmId, csvSnapshot) {
  var header = csvSnapshot.header;
  var rows = csvSnapshot.rows;
  // Toast de progresso
  showToast('i', 'Importando...', 'Aguarde, enviando ' + rows.length + ' produtos.');

  // Mapear colunas automaticamente
  var colMap = {
    nome: findCol(header, ['nome','name','produto','medicamento','descricao_produto']),
    lab:  findCol(header, ['laboratorio','fabricante','lab','manufacturer']),
    cat:  findCol(header, ['categoria','category','classe','tipo']),
    preco: findCol(header, ['preco','price','valor','preco_venda','venda']),
    ctrl: findCol(header, ['controlado','controlled','receita','tarja']),
    uni:  findCol(header, ['unidade','unit','uni','apresentacao']),
    desc: findCol(header, ['descricao','description','obs','observacao']),
    estoque: findCol(header, ['estoque','quantidade','qty','stock','qtd'])
  };

  // Log para diagnóstico
  console.log('[CSV] header:', header);
  console.log('[CSV] colMap:', colMap);
  console.log('[CSV] total rows bruto:', rows.length);
  console.log('[CSV] farmId:', farmId);
  console.log('[CSV] primeira row:', rows[0]);

  var produtos = rows.map(function(row) {
    var nome = getCol(row, colMap.nome);
    var preco = parseFloat((getCol(row, colMap.preco)||'10').replace(',','.'));
    if (isNaN(preco) || preco <= 0) preco = 10.00;
    return {
      farmacia_id:  farmId,
      nome:         nome || '',
      laboratorio:  getCol(row, colMap.lab),
      categoria:    getCol(row, colMap.cat),
      preco:        preco,
      controlado:   /sim|yes|s|1|tarja/i.test(getCol(row, colMap.ctrl)||''),
      unidade:      getCol(row, colMap.uni) || 'cx',
      descricao:    getCol(row, colMap.desc),
      estoque:      parseInt(getCol(row, colMap.estoque)) || 0,
      principio_ativo: getCol(row, findCol(header, ['principio_ativo','principio','ativo','pa']))
    };
  }).filter(function(p){ return p.nome && p.nome.length > 1; });

  console.log('[CSV] produtos válidos após filter:', produtos.length);
  if (produtos.length === 0) {
    showToast('e','CSV sem dados válidos','Verifique se a coluna "nome" existe no arquivo.');
    btn.textContent = 'Importar';
    return;
  }
  console.log('[CSV] exemplo produto[0]:', produtos[0]);

  // Enviar em lotes de 50
  var lotes = [];
  for (var i=0; i<produtos.length; i+=50) lotes.push(produtos.slice(i,i+50));
  console.log('[CSV] total lotes:', lotes.length);

  var ok=0, erros=0;
  var next = function(idx) {
    if (idx >= lotes.length) {
      showToast(ok>0?'s':'w', 'Importação concluída!', ok + ' produto(s) importado(s)' + (erros?' · '+erros+' com erro':''));
      loadProds().then(function(){ renderProd(); });
      return;
    }
    console.log('[CSV] enviando lote', idx+1, '/', lotes.length, '—', lotes[idx].length, 'itens');
    apiFetch('/produtos/importar', {
      method: 'POST',
      body: JSON.stringify({produtos: lotes[idx]})
    }).then(function(res) {
      console.log('[CSV] lote', idx+1, 'resposta:', res.status, res.data);
      if (res.ok) {
        ok += (res.data.criados || lotes[idx].length);
      } else {
        erros += lotes[idx].length;
        var errMsg = res.data && res.data.error ? res.data.error : ('HTTP ' + res.status + ' — verifique o backend');
        showToast('e', 'Erro lote ' + (idx+1), errMsg);
        if (idx === 0) { return; }
      }
      next(idx+1);
    }).catch(function(e){
      console.error('[CSV] catch lote', idx+1, e);
      erros += lotes[idx].length;
      next(idx+1);
    });
  };
  next(0);
}

function findCol(header, names) {
  for (var i=0; i<names.length; i++) {
    var idx = header.indexOf(names[i]);
    if (idx !== -1) return idx;
  }
  return -1;
}
function getCol(row, idx) {
  return idx !== -1 && row[idx] ? row[idx].trim() : '';
}

function salvarNovaSenha() {
  var atual  = document.getElementById('cfg-senha-atual')  ? document.getElementById('cfg-senha-atual').value  : '';
  var nova   = document.getElementById('cfg-nova-senha')   ? document.getElementById('cfg-nova-senha').value   : '';
  var conf   = document.getElementById('cfg-conf-senha')   ? document.getElementById('cfg-conf-senha').value   : '';
  var msg    = document.getElementById('cfg-senha-msg');

  if (!atual || !nova || !conf) { setMsg(msg,'e','Preencha todos os campos.'); return; }
  if (nova.length < 6)          { setMsg(msg,'e','A nova senha deve ter pelo menos 6 caracteres.'); return; }
  if (nova !== conf)             { setMsg(msg,'e','As senhas não coincidem.'); return; }

  setMsg(msg,'i','Salvando...');
  apiFetch('/auth/reset-senha', {
    method: 'POST',
    body: JSON.stringify({senha_atual: atual, nova_senha: nova})
  }).then(function(res) {
    if (res.ok) {
      setMsg(msg,'s','✅ Senha alterada com sucesso!');
      document.getElementById('cfg-senha-atual').value = '';
      document.getElementById('cfg-nova-senha').value  = '';
      document.getElementById('cfg-conf-senha').value  = '';
      showToast('s','Senha alterada!','Novo acesso válido no painel e no app.');
    } else {
      setMsg(msg,'e', res.data.error || 'Erro ao alterar senha.');
    }
  }).catch(function(){ setMsg(msg,'e','Sem conexão. Tente novamente.'); });
}
function setMsg(el, type, text) {

  if (ov) ov.classList.remove('on');
  document.body.style.overflow = '';
}
// Fechar sidebar ao navegar (mobile)
var _origGoto = goto;
goto = function(id) {
  if (window.innerWidth <= 768) closeSidebar();
  _origGoto(id);
};

</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Chat Modal -->
<div id="chat-modal">
  <div class="chat-box">
    <div class="chat-hdr">
      <div style="flex:1">
        <h3 id="chat-titulo">Chat do chamado</h3>
        <div id="chat-sub" style="font-size:12px;color:var(--t3)"></div>
      </div>
      <button onclick="fecharChat()">✕</button>
    </div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-inp">
      <textarea id="chat-input" placeholder="Digite sua resposta..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMsgChat();}"
        oninput="if(_chatSocket&&_chatId)_chatSocket.emit('digitando',{chamado_id:_chatId,autor_id:CU&&CU.id})"></textarea>
      <button onclick="enviarMsgChat()">Enviar</button>
    </div>
  </div>
</div>

<script>
var _chatId = null, _chatSocket = null;

function abrirChat(chamadoId, pedNum, farmNome, motivo) {
  _chatId = chamadoId;
  document.getElementById('chat-titulo').textContent = 'Chat · Pedido #' + pedNum;
  document.getElementById('chat-sub').textContent = farmNome + ' · ' + (CHAM_MOTIVOS[motivo] || motivo);
  document.getElementById('chat-msgs').innerHTML = '<div style="text-align:center;color:var(--t3);padding:20px">Carregando...</div>';
  document.getElementById('chat-modal').classList.add('open');

  apiFetch('/chamados/' + chamadoId + '/mensagens').then(function(res) {
    renderMsgsChat(res.ok ? (res.data || []) : []);
  });

  if (_chatSocket) { _chatSocket.disconnect(); }
  _chatSocket = io('https://web-production-b66cd.up.railway.app', { transports: ['websocket','polling'] });
  _chatSocket.emit('join_chamado', chamadoId);
  _chatSocket.on('nova_mensagem', function(msg) {
    appendMsgChat(msg);
    // Remover indicador digitando quando mensagem chegar
    var dEl = document.getElementById('chat-digitando');
    if (dEl) dEl.remove();
  });
  _chatSocket.on('digitando', function(data) {
    if (data.autor_id !== (window._painelUser && window._painelUser.id)) {
      var el = document.getElementById('chat-msgs');
      var dEl = document.getElementById('chat-digitando');
      if (!dEl) {
        dEl = document.createElement('div');
        dEl.id = 'chat-digitando';
        dEl.style.cssText = 'align-self:flex-start;background:#fff;border:1px solid #E3E8EE;border-radius:16px;border-bottom-left-radius:4px;padding:8px 14px;font-size:13px;color:#9AAABB;max-width:75%;';
        dEl.textContent = 'digitando...';
        el.appendChild(dEl);
        el.scrollTop = el.scrollHeight;
      }
      clearTimeout(window._typingTimer);
      window._typingTimer = setTimeout(function() {
        var d = document.getElementById('chat-digitando');
        if (d) d.remove();
      }, 3000);
    }
  });
}

function fecharChat() {
  document.getElementById('chat-modal').classList.remove('open');
  if (_chatSocket) { _chatSocket.emit('leave_chamado', _chatId); _chatSocket.disconnect(); _chatSocket = null; }
  _chatId = null;
}

function renderMsgsChat(msgs) {
  var el = document.getElementById('chat-msgs');
  if (!msgs.length) { el.innerHTML = '<div style="text-align:center;color:var(--t3);padding:40px">Nenhuma mensagem ainda.</div>'; return; }
  el.innerHTML = '';
  msgs.forEach(function(m) { appendMsgChat(m, false); });
  el.scrollTop = el.scrollHeight;
}

function appendMsgChat(msg, scroll) {
  var mine = CU && CU.id === msg.autor_id;
  var hora = new Date(msg.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var div = document.createElement('div');
  div.className = 'cmsg ' + (mine ? 'mine' : 'other');
  var bubbleStyle = mine
    ? 'padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:13px;line-height:1.5;background:#C0392B;color:#fff;display:inline-block;'
    : 'padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:13px;line-height:1.5;background:#fff;color:#1A2532;border:1px solid #E3E8EE;display:inline-block;';
  div.innerHTML = (!mine ? '<div class="cautor">' + msg.autor_nome + '</div>' : '') +
    '<div style="' + bubbleStyle + '">' + escH(msg.texto) + '</div>' +
    '<div class="chora">' + hora + '</div>';
  document.getElementById('chat-msgs').appendChild(div);
  if (scroll !== false) document.getElementById('chat-msgs').scrollTop = 99999;
}

function enviarMsgChat() {
  var input = document.getElementById('chat-input');
  var txt = input.value.trim();
  if (!txt || !_chatId) return;
  input.value = '';
  apiFetch('/chamados/' + _chatId + '/mensagens', { method:'POST', body: JSON.stringify({ texto: txt }) })
    .then(function(res) { if (!res.ok) showToast('e','Erro', res.data.error || 'Não enviado.'); });
}

function escH(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Fechar ao clicar fora
document.getElementById('chat-modal').addEventListener('click', function(e) {
  if (e.target === this) fecharChat();
});


// ── Horário automático de funcionamento ──────────────────────
function verificarHorarioFarmacias() {
  var agora = new Date();
  var diaSemana = agora.getDay(); // 0=dom, 1=seg...
  var horaAtual = agora.getHours() * 60 + agora.getMinutes();

  FARMS.forEach(function(farm) {
    if (!farm.horarios || !farm.horarios.length) return;
    var horarioDia = farm.horarios.find(function(h) {
      return h.dia_semana === diaSemana && h.ativo;
    });
    var deveAbrir = false;
    if (horarioDia) {
      var partsAb = horarioDia.hora_abertura.split(':');
      var partsFe = horarioDia.hora_fechamento.split(':');
      var ab = parseInt(partsAb[0]) * 60 + parseInt(partsAb[1]);
      var fe = parseInt(partsFe[0]) * 60 + parseInt(partsFe[1]);
      deveAbrir = horaAtual >= ab && horaAtual < fe;
    }
    if (farm.aberta !== deveAbrir) {
      // Atualiza automaticamente
      apiFetch('/farmacias/' + farm.id, AT, {
        method: 'PATCH',
        body: JSON.stringify({ aberta: deveAbrir })
      }).then(function() {
        farm.aberta = deveAbrir;
      }).catch(function(){});
    }
  });
}

// Polling: atualizar badge de chamados a cada 30s
setInterval(function() {
  if (typeof loadChamados === 'function') loadChamados();
}, 30000);

// ── Rastreamento público ──────────────────────────────────────
function mostrarRastreamentoPublico(pedidoId) {
  var API_PUB = 'https://web-production-b66cd.up.railway.app/api';
  var lp = document.getElementById('lp');
  var ap = document.getElementById('ap');
  if (lp) lp.classList.add('hide');
  if (ap) ap.classList.add('hide');

  var wrap = document.createElement('div');
  wrap.id = 'rastrear-wrap';
  wrap.style.cssText = 'min-height:100vh;background:#F5F7F9;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Nunito,sans-serif';
  wrap.innerHTML = '<div style="width:100%;max-width:420px"><div style="text-align:center;margin-bottom:24px"><span style="font-size:32px">🛵</span><div style="font-size:20px;font-weight:800;color:#1E2D3D;margin-top:8px">FlyPharma</div><div style="font-size:13px;color:#9AAABB">Rastreamento de pedido</div></div><div id="rastrear-card" style="background:#fff;border-radius:16px;padding:24px;border:1px solid #E3E8EE;text-align:center"><div style="color:#9AAABB;font-size:13px">⏳ Carregando...</div></div></div>';
  document.body.appendChild(wrap);

  var STATUS_INFO = {
    pendente:              { emoji:'⏳', label:'Aguardando pagamento', cor:'#C98A10' },
    confirmado:            { emoji:'✅', label:'Pedido confirmado',     cor:'#1E2D3D' },
    preparando:            { emoji:'💊', label:'Preparando seu pedido', cor:'#C98A10' },
    aguardando_entregador: { emoji:'🔍', label:'Buscando entregador',   cor:'#8B1A1A' },
    em_entrega:            { emoji:'🛵', label:'A caminho!',             cor:'#C0392B' },
    entregue:              { emoji:'🎉', label:'Entregue!',              cor:'#22C97A' },
    cancelado:             { emoji:'❌', label:'Cancelado',              cor:'#F0455A' },
  };

  function renderCard(p) {
    var s = STATUS_INFO[p.status] || { emoji:'📦', label:p.status, cor:'#9AAABB' };
    var card = document.getElementById('rastrear-card');
    if (!card) return;
    var etapas = ['confirmado','preparando','aguardando_entregador','em_entrega','entregue'];
    var etapaAtual = etapas.indexOf(p.status);
    var html = '';
    html += '<div style="display:inline-flex;align-items:center;gap:8px;background:' + s.cor + '22;border-radius:20px;padding:8px 16px;margin-bottom:16px">';
    html += '<span style="font-size:20px">' + s.emoji + '</span><span style="font-size:14px;font-weight:700;color:' + s.cor + '">' + s.label + '</span></div>';
    html += '<div style="font-size:22px;font-weight:800;color:#1E2D3D;margin-bottom:4px">Pedido #' + (p.numero||pedidoId.slice(0,6)) + '</div>';
    html += '<div style="font-size:13px;color:#5A6A7E;margin-bottom:20px">' + (p.farmacia_nome||'Farmácia') + '</div>';
    if (p.status === 'em_entrega' && p.lat_entregador && p.lng_entregador) {
      html += '<div style="border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid #E3E8EE;height:180px">';
      html += '<iframe width="100%" height="180" frameborder="0" src="https://www.openstreetmap.org/export/embed.html?bbox=' + (p.lng_entregador-0.005) + ',' + (p.lat_entregador-0.005) + ',' + (p.lng_entregador+0.005) + ',' + (p.lat_entregador+0.005) + '&layer=mapnik&marker=' + p.lat_entregador + ',' + p.lng_entregador + '" style="border:0"></iframe>';
      html += '</div>';
    }
    html += '<div style="text-align:left;background:#F5F7F9;border-radius:12px;padding:16px;margin-bottom:16px">';
    etapas.forEach(function(e, i) {
      var si = STATUS_INFO[e] || {};
      var ok = etapaAtual >= i;
      html += '<div style="display:flex;align-items:center;gap:12px;' + (i<etapas.length-1?'margin-bottom:12px':'') + '">';
      html += '<div style="width:24px;height:24px;border-radius:50%;background:' + (ok?'#C0392B':'#E3E8EE') + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:' + (ok?'#1E2D3D':'#9AAABB') + '">' + (ok?'✓':'·') + '</div>';
      html += '<span style="font-size:13px;font-weight:' + (etapaAtual===i?'700':'500') + ';color:' + (ok?'#1E2D3D':'#9AAABB') + '">' + (si.emoji||'') + ' ' + (si.label||e) + '</span></div>';
    });
    html += '</div>';
    html += '<a href="flypharma://pedido/' + pedidoId + '" style="display:block;background:#C0392B;color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:14px;border-radius:12px;text-align:center">📱 Abrir no app FlyPharma</a>';
    card.innerHTML = html;
  }

  fetch(API_PUB + '/pedidos/' + pedidoId + '/publico')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.status) {
        renderCard(d);
        if (['entregue','cancelado'].indexOf(d.status) < 0) {
          setInterval(function() {
            fetch(API_PUB + '/pedidos/' + pedidoId + '/publico')
              .then(function(r) { return r.json(); })
              .then(function(d2) { if (d2 && d2.status) renderCard(d2); })
              .catch(function(){});
          }, 10000);
        }
      } else {
        document.getElementById('rastrear-card').innerHTML = '<div style="color:#F0455A;font-size:14px">❌ Pedido não encontrado.</div>';
      }
    })
    .catch(function() {
      document.getElementById('rastrear-card').innerHTML = '<div style="color:#F0455A;font-size:14px">❌ Não foi possível carregar o pedido.</div>';
    });
}

// ── Socket principal da farmácia ─────────────────────────────
// Conecta após login e entra na sala da farmácia para receber eventos em tempo real
(function iniciarSocketPainel() {
  if (typeof io === 'undefined') return;
  var token = localStorage.getItem('fly_token') || (typeof AT !== 'undefined' ? AT : null);
  if (!token) { setTimeout(iniciarSocketPainel, 2000); return; }

  var _mainSocket = io('https://web-production-b66cd.up.railway.app', {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 20,
    reconnectionDelay: 3000,
  });

  _mainSocket.on('connect', function() {
    // Entra na sala da farmácia para receber eventos
    var farmId = typeof CU !== 'undefined' && CU && CU.farmacia_id ? CU.farmacia_id : null;
    if (farmId) _mainSocket.emit('join_farmacia', farmId);
    // Admin entra em todas as salas das farmácias
    if (typeof CU !== 'undefined' && CU && CU.role === 'admin' && typeof FARMS !== 'undefined') {
      FARMS.forEach(function(f) { _mainSocket.emit('join_farmacia', f.id); });
    }
  });

  // ── Estoque baixo ─────────────────────────────────────────
  _mainSocket.on('estoque_baixo', function(data) {
    // Toast de alerta
    if (typeof showToast === 'function') {
      showToast('w', '⚠️ Estoque baixo: ' + data.total + ' produto(s)', data.produtos);
    }
    // Badge de alerta no menu de produtos
    var menuProd = document.querySelector('[onclick*="produtos"]') || document.querySelector('[data-page="produtos"]');
    if (menuProd && !menuProd.querySelector('.estoque-badge')) {
      var badge = document.createElement('span');
      badge.className = 'estoque-badge';
      badge.style.cssText = 'background:#F0455A;color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:2px 6px;margin-left:6px';
      badge.textContent = data.total;
      menuProd.appendChild(badge);
    }
    // Notificação do browser se permitido
    if (window.Notification && Notification.permission === 'granted') {
      new Notification('⚠️ FlyPharma — Estoque baixo', {
        body: data.total + ' produto(s) abaixo do mínimo: ' + (data.produtos || ''),
        icon: '/favicon.png',
      });
    }
  });

  // ── Pedido sem entregador ─────────────────────────────────
  _mainSocket.on('pedido_sem_entregador', function(data) {
    if (typeof showToast === 'function') {
      showToast('w',
        '🛵 Pedido #' + data.numero + ' sem entregador',
        'R$' + Number(data.total).toFixed(2) + ' · já passaram 10 minutos'
      );
    }
    // Recarrega pedidos para atualizar o badge
    if (typeof loadPeds === 'function') loadPeds();
  });

  // ── Status atualizado em tempo real ──────────────────────
  _mainSocket.on('status_atualizado', function(data) {
    if (typeof loadPeds === 'function') loadPeds();
  });

  window._mainSocket = _mainSocket;
})();
</script>
