<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyPharma — Painel de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--t:#3ECFBF;--td:#2AB5A6;--tl:#E8FAF8;--n:#1E2D3D;--bg:#F5F7F9;--w:#fff;--br:#E3E8EE;--tx:#1A2532;--t2:#5A6A7E;--t3:#9AAABB;--g:#22C97A;--a:#F5A623;--r:#F0455A;--sw:230px;--hh:62px}
body{font-family:'Inter',sans-serif;font-size:14px;background:var(--bg);color:var(--tx)}
#lp{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--n);position:fixed;inset:0;z-index:1000}
#lp.hide{display:none}
.lb{background:var(--w);border-radius:20px;padding:40px;width:420px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.llg{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.lt{font-family:'Nunito';font-weight:800;font-size:22px;color:var(--n)}
.lt span{color:var(--t)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.fg input{width:100%;padding:11px 14px;border:1.5px solid #D0D8E2;border-radius:10px;font-size:14px;color:var(--tx);outline:none}
.fg input:focus{border-color:var(--t)}
#lerr{color:var(--r);font-size:12px;text-align:center;display:none;padding:8px;background:rgba(240,69,90,.08);border-radius:6px;margin-top:8px}
.lbtn{width:100%;height:50px;background:var(--t);color:var(--n);border:none;border-radius:10px;font-family:'Nunito';font-weight:800;font-size:16px;cursor:pointer;margin-top:6px}
.lbtn:hover{background:var(--td)}
.ldemo{margin-top:18px;padding:12px 14px;background:var(--bg);border-radius:10px;font-size:12px;color:var(--t2);line-height:1.8}
.ldemo b{display:block;margin-bottom:2px;font-size:12px;color:var(--tx)}
.app{display:flex;min-height:100vh}
.sb{width:var(--sw);background:var(--n);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sb-lt{font-family:'Nunito';font-weight:800;font-size:18px;color:#fff}
.sb-lt span{color:var(--t)}
.sb-role{margin:10px 14px;padding:6px 12px;border-radius:10px;font-size:11px;font-weight:700;text-align:center}
.sb-role.adm{background:rgba(245,166,35,.2);color:var(--a)}
.sb-role.frm{background:rgba(62,207,191,.15);color:var(--t)}
.sb-sec{padding:10px 12px 4px}
.sb-lbl{font-size:10px;font-weight:600;letter-spacing:1.4px;color:rgba(255,255,255,.3);text-transform:uppercase;padding:0 10px;margin-bottom:4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.55);cursor:pointer;font-size:13px;font-weight:500;user-select:none;transition:all .15s}
.sb-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.sb-item.on{background:rgba(62,207,191,.15);color:var(--t)}
.sb-item svg{width:17px;height:17px;flex-shrink:0}
.sb-bdg{margin-left:auto;background:var(--r);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sb-bot{margin-top:auto;padding:14px;flex-shrink:0}
.sb-usr{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-usr:hover{background:rgba(255,255,255,.12)}
.sb-av{width:34px;height:34px;border-radius:8px;background:var(--t);display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;font-size:14px;color:var(--n);flex-shrink:0}
.sb-nm{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sb{font-size:11px;color:rgba(255,255,255,.4)}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column}
.topbar{height:var(--hh);background:var(--w);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 28px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(30,45,61,.06)}
.tb-title{font-family:'Nunito';font-weight:700;font-size:17px;color:var(--n);flex:1}
.ibt{width:36px;height:36px;border-radius:9px;background:var(--bg);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}
.ibt:hover{background:#D0D8E2}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap}
.btn-p{background:var(--t);color:var(--n)}.btn-p:hover{background:var(--td)}
.btn-o{background:transparent;border:1.5px solid #D0D8E2;color:var(--t2)}.btn-o:hover{background:var(--bg)}
.btn-d{background:rgba(240,69,90,.1);color:var(--r);border:1px solid rgba(240,69,90,.25)}.btn-d:hover{background:rgba(240,69,90,.2)}
.btn-g{background:rgba(34,201,122,.12);color:#18A065;border:1px solid rgba(34,201,122,.25)}
.page{padding:24px 28px;display:none}
.page.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.sc{background:var(--w);border:1px solid var(--br);border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(30,45,61,.06)}
.si{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.si.t{background:var(--tl);color:var(--td)}.si.g{background:rgba(34,201,122,.12);color:#18A065}.si.a{background:rgba(245,166,35,.12);color:#C98A10}.si.r{background:rgba(240,69,90,.10);color:#D03348}
.sv{font-family:'Nunito';font-size:26px;font-weight:800;color:var(--n);line-height:1;margin-bottom:4px}
.sl{font-size:12px;color:var(--t2);margin-bottom:10px}
.sd{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px}
.sd.up{background:rgba(34,201,122,.12);color:#18A065}.sd.dn{background:rgba(240,69,90,.10);color:#D03348}
.card{background:var(--w);border:1px solid var(--br);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(30,45,61,.06)}
.ch{padding:14px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:8px}
.ct{font-family:'Nunito';font-size:14px;font-weight:700;color:var(--n)}
.ca{font-size:12px;color:var(--t);font-weight:600;cursor:pointer;margin-left:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--br);background:var(--bg)}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--br);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--tl)}
.oid{font-family:'Nunito';font-weight:700;font-size:12.5px;color:var(--n)}
.b{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.b::before{content:'';width:5px;height:5px;border-radius:50%}
.novo::before{background:var(--t)}.novo{background:rgba(62,207,191,.12);color:var(--td)}
.prep::before{background:var(--a)}.prep{background:rgba(245,166,35,.12);color:#C98A10}
.entr::before{background:var(--n)}.entr{background:rgba(30,45,61,.10);color:var(--n)}
.cok::before{background:var(--g)}.cok{background:rgba(34,201,122,.12);color:#18A065}
.can::before{background:var(--r)}.can{background:rgba(240,69,90,.10);color:#D03348}
.aberta::before{background:var(--t)}.aberta{background:rgba(62,207,191,.12);color:var(--td)}
.fechada::before{background:var(--t3)}.fechada{background:rgba(154,170,187,.15);color:var(--t3)}
.ativo::before{background:var(--g)}.ativo{background:rgba(34,201,122,.12);color:#18A065}
.inativo::before{background:var(--r)}.inativo{background:rgba(240,69,90,.10);color:#D03348}
.fb{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sb2{display:flex;align-items:center;gap:8px;background:var(--w);border:1.5px solid #D0D8E2;border-radius:9px;padding:8px 14px;flex:1;max-width:300px}
.sb2 input{background:none;border:none;outline:none;color:var(--tx);font-size:13px;flex:1}
.sb2 input::placeholder{color:var(--t3)}
.fc{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;border:1.5px solid var(--br);color:var(--t2);background:var(--w);transition:all .15s}
.fc.on{background:var(--tl);border-color:var(--t);color:var(--td);font-weight:600}
.fg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.fcard{background:var(--w);border:1.5px solid var(--br);border-radius:14px;overflow:hidden;transition:all .15s}
.fcard:hover{border-color:var(--t);box-shadow:0 2px 12px rgba(30,45,61,.09)}
.ftop{height:80px;background:linear-gradient(135deg,var(--n),#253647);display:flex;align-items:center;justify-content:center;position:relative}
.flogo{width:52px;height:52px;border-radius:12px;background:var(--t);display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;font-size:22px;color:var(--n)}
.fbody{padding:14px}
.fn{font-family:'Nunito';font-weight:700;font-size:15px;color:var(--n);margin-bottom:2px}
.fc2{font-size:12px;color:var(--t2);margin-bottom:10px}
.fst{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.fstv{font-family:'Nunito';font-weight:700;font-size:16px;color:var(--n)}
.fstl{font-size:10px;color:var(--t3)}
.fft{padding:10px 14px;border-top:1px solid var(--br);display:flex;gap:8px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.on{opacity:1;pointer-events:all}
.modal{background:var(--w);border-radius:14px;width:560px;max-height:90vh;overflow:auto;transform:translateY(16px);transition:transform .2s;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mo.on .modal{transform:translateY(0)}
.mh{padding:20px 24px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between}
.mt{font-family:'Nunito';font-weight:700;font-size:16px;color:var(--n)}
.mx{width:30px;height:30px;border-radius:7px;background:var(--bg);border:none;cursor:pointer;font-size:16px;color:var(--t2)}
.mb{padding:24px}
.mf{padding:16px 24px;border-top:1px solid var(--br);display:flex;justify-content:flex-end;gap:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fc3{display:flex;flex-direction:column;gap:5px}
.fc3 label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.fc3 input,.fc3 select,.fc3 textarea{padding:9px 12px;border:1.5px solid #D0D8E2;border-radius:10px;font-size:13px;color:var(--tx);outline:none;width:100%}
.fc3 input:focus,.fc3 select:focus,.fc3 textarea:focus{border-color:var(--t)}
.fc3 textarea{resize:vertical;min-height:80px}
.full{grid-column:1/-1}
.two{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-bottom:22px}
.al{padding:4px 0}
.ai{display:flex;align-items:flex-start;gap:12px;padding:10px 18px}
.ai:hover{background:var(--tl)}
.adot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.aT{font-size:13px;color:var(--tx);margin-bottom:2px}
.aS{font-size:11px;color:var(--t3)}
.mapA{background:#E8F4F2;height:200px;position:relative;overflow:hidden}
.mapG{position:absolute;inset:0;background-image:linear-gradient(rgba(30,45,61,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(30,45,61,.05) 1px,transparent 1px);background-size:28px 28px}
.dpin{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid;transform:translate(-50%,-50%)}
.ch2{padding:12px 18px 4px;display:flex;align-items:flex-end;gap:5px;height:76px}
.bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar{width:100%;border-radius:4px 4px 0 0;background:rgba(62,207,191,.3);transition:height .7s cubic-bezier(.34,1.56,.64,1)}
.bar.td{background:var(--t)}
.bL{font-size:9.5px;color:var(--t3)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:48px;text-align:center;color:var(--t2)}
.empty .ei{font-size:40px;margin-bottom:12px}
.empty .eT{font-family:'Nunito';font-size:17px;font-weight:700;color:var(--n);margin-bottom:6px}
.toast-area{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:9998}
.toast{background:var(--w);border:1.5px solid var(--br);border-radius:10px;padding:13px 16px;display:flex;align-items:flex-start;gap:12px;min-width:280px;max-width:340px;box-shadow:0 2px 12px rgba(30,45,61,.09);animation:ts .3s ease}
@keyframes ts{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.ti{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ti.s{background:rgba(34,201,122,.12)}.ti.i{background:var(--tl)}.ti.w{background:rgba(245,166,35,.12)}.ti.e{background:rgba(240,69,90,.10)}
.tT{font-size:13px;font-weight:600;color:var(--n);margin-bottom:2px}
.tB{font-size:12px;color:var(--t2)}
@media(max-width:1100px){.sg{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
/* ── RESPONSIVIDADE MOBILE ─────────────────────────────────── */
@media(max-width:768px){
  :root{--sw:0px}

  /* Sidebar vira drawer overlay */
  .sb{
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    width:260px;
    box-shadow:4px 0 24px rgba(0,0,0,.3);
    z-index:200;
  }
  .sb.open{transform:translateX(0)}

  /* Overlay escuro quando sidebar aberta */
  .sb-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.5);z-index:199;
  }
  .sb-overlay.on{display:block}

  /* Main ocupa tudo */
  .main{margin-left:0 !important}

  /* Topbar com botão hamburguer */
  .topbar{padding:0 16px}
  .hbg{display:flex !important}

  /* Pages com padding menor */
  .page{padding:16px}

  /* Cards de stats em 2 colunas */
  .sg{grid-template-columns:repeat(2,1fr);gap:10px}
  .sc{padding:14px}
  .sv{font-size:20px}

  /* Tabela scroll horizontal */
  .card{overflow-x:auto}
  .tbl{min-width:600px}

  /* Farm cards em 1 coluna */
  .fg2{grid-template-columns:1fr}

  /* Modal fullscreen */
  .modal{
    width:100% !important;
    max-width:100% !important;
    max-height:100vh !important;
    border-radius:16px 16px 0 0 !important;
    margin-top:auto;
  }
  .mo{align-items:flex-end !important}

  /* Form rows em coluna */
  .fr{flex-direction:column}
  .fc3{min-width:unset !important;width:100% !important}

  /* Barra de filtros scroll */
  .fb{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .fb::-webkit-scrollbar{display:none}

  /* Toast menor */
  .toast{min-width:unset;max-width:calc(100vw - 32px)}
  .toast-area{right:16px;left:16px;bottom:16px}

  /* Login */
  .lb{width:calc(100vw - 32px);padding:28px 20px;border-radius:14px}
}

@media(max-width:480px){
  .sg{grid-template-columns:1fr 1fr}
  .sc{padding:12px}
  .sv{font-size:18px}
  .tb-title{font-size:15px}
}

/* Hamburguer — escondido no desktop */
.hbg{
  display:none;
  width:36px;height:36px;border-radius:9px;
  background:var(--bg);border:1px solid var(--br);
  align-items:center;justify-content:center;
  cursor:pointer;color:var(--t2);flex-shrink:0;
  margin-right:4px;
}
.hbg svg{pointer-events:none}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="lp">
  <div class="lb">
    <div class="llg">
      <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
        <path d="M6 16C4 11 3 6 5.5 3 9 4.5 12 8.5 12 14Z" fill="#3ECFBF"/>
        <path d="M6 20C4 25 4.5 30 7 33 10.5 31 12.5 27 12 21Z" fill="#3ECFBF" opacity=".7"/>
        <path d="M12 13L24 8Q30 7 31 13L19 18Q13 19 12 13Z" fill="#3ECFBF"/>
        <path d="M19 18L31 13Q37 14.5 36 21L24 26Q18 27 19 18Z" fill="#1E2D3D"/>
      </svg>
      <div class="lt">fly<span>pharma</span></div>
    </div>
    <h2 style="font-family:'Nunito';font-weight:800;font-size:20px;color:var(--n);text-align:center;margin-bottom:4px">Entrar no painel</h2>
    <p style="text-align:center;color:var(--t2);font-size:13px;margin-bottom:24px">Gestão FlyPharma</p>
    <div class="fg"><label>E-MAIL</label><input type="email" id="lemail" value="admin@flypharma.com" placeholder="seu@email.com"></div>
    <div class="fg"><label>SENHA</label><input type="password" id="lsenha" value="admin123" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;"></div>
    <div id="lerr"></div>
    <button class="lbtn" id="lbtn" onclick="doLogin()">Entrar</button>
    <div style="text-align:center;margin-top:14px">
      <span style="font-size:13px;color:var(--t2)">Esqueceu a senha? </span>
      <a href="#" onclick="abrirEsqueciSenha();return false" style="font-size:13px;color:var(--t);font-weight:600;text-decoration:none">Redefinir</a>
    </div>
    <div class="ldemo">
      <b>Contas de demonstracao:</b>
      Admin: admin@flypharma.com / admin123<br>
      Farmacia: farmacia@drogasil.com / farm123
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <aside class="sb">
    <div class="sb-logo">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
        <path d="M6 16C4 11 3 6 5.5 3 9 4.5 12 8.5 12 14Z" fill="#3ECFBF"/>
        <path d="M6 20C4 25 4.5 30 7 33 10.5 31 12.5 27 12 21Z" fill="#3ECFBF" opacity=".7"/>
        <path d="M12 13L24 8Q30 7 31 13L19 18Q13 19 12 13Z" fill="#3ECFBF"/>
        <path d="M19 18L31 13Q37 14.5 36 21L24 26Q18 27 19 18Z" fill="#1E2D3D"/>
      </svg>
      <div class="sb-lt">fly<span>pharma</span></div>
    </div>
    <div id="sb-role" class="sb-role adm">Admin Mestre</div>
    <div id="sb-nav"></div>
    <div class="sb-bot">
      <div class="sb-usr" onclick="doLogout()">
        <div class="sb-av" id="sb-av">A</div>
        <div style="flex:1;min-width:0">
          <div class="sb-nm" id="sb-nm">Admin</div>
          <div class="sb-sb">Clique para sair</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"><path d="M9 3H5a1 1 0 00-1 1v12a1 1 0 001 1h4M13 15l4-5-4-5M17 10H7"/></svg>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="hbg" id="hbg-btn" onclick="toggleSidebar()">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 5h14M3 10h14M3 15h14"/>
        </svg>
      </div>

<script>
// FlyPharma Painel - JavaScript completo
const API = 'https://web-production-b66cd.up.railway.app/api';
let CU = null, AT = null, MC = {};

// ── ESTADO DA APLICAÇÃO (carregado da API, nunca hardcoded) ────
let FARMS = [], PRODS = [], PEDS = [], USRS = [], CATS = [], CHAMS = [], CURRENT_FARM_ID = null;
const SL = {pendente:'Novo',confirmado:'Confirmado',preparando:'Preparando',aguardando_entregador:'Aguardando',em_entrega:'Em entrega',entregue:'Entregue',cancelado:'Cancelado'};
const SC = {pendente:'novo',confirmado:'novo',preparando:'prep',aguardando_entregador:'prep',em_entrega:'entr',entregue:'cok',cancelado:'can'};

// ── HELPER API ────────────────────────────────────────────────
function apiHeaders() {
  var h = {'Content-Type':'application/json'};
  var token = AT || localStorage.getItem('fly_at');
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = apiHeaders();
  return fetch(API + path, opts).then(function(r) {
    if (r.status === 401) { doLogout(); throw new Error('Sessão expirada'); }
    return r.json().then(function(d) { return {ok: r.ok, status: r.status, data: d}; });
  });
}

// ── CARREGAR DADOS DA API ─────────────────────────────────────
function loadFarms() {
  return apiFetch('/farmacias/admin/todas').then(function(res) {
    if (res.ok) {
      FARMS = Array.isArray(res.data) ? res.data : (res.data.farmacias || res.data.data || []);
      // normaliza campos
      FARMS = FARMS.map(function(f) {
        return {
          id: f.id || f._id,
          nome: f.nome || f.name || '',
          cidade: f.cidade || f.city || '',
          bairro: f.bairro || f.neighborhood || '',
          logradouro: f.logradouro || f.endereco || '',
          cnpj: f.cnpj || '',
          pedidos: f.pedidos || f.total_pedidos || 0,
          fat: f.faturamento || f.fat || 0,
          aberta: f.aberta !== undefined ? f.aberta : (f.status === 'aberta'),
          ativo: f.ativo !== undefined ? f.ativo : (f.status !== 'inativo'),
          taxa_entrega: f.taxa_entrega || 6.90,
          raio_entrega_km: f.raio_entrega_km || 5,
          pedido_minimo: f.pedido_minimo || 0
        };
      });
    }
  }).catch(function() {});
}
function loadProds() {
  return apiFetch('/produtos').then(function(res) {
    if (res.ok) {
      PRODS = Array.isArray(res.data) ? res.data : (res.data.produtos || res.data.data || []);
      PRODS = PRODS.map(function(p) {
        return {
          id: p.id || p._id,
          nome: p.nome || p.name || '',
          lab: p.laboratorio || p.lab || '',
          cat: p.categoria_nome || (CATS.find(function(c){return c.id===p.categoria_id;}) || {}).nome || p.categoria || p.cat || '',
          categoria_id: p.categoria_id || null,
          farmacia_id: p.farmacia_id || p.farm_id || '',
          preco: p.preco || p.price || 0,
          promo: p.preco_promocional || p.promo || null,
          ctrl: p.controlado || p.ctrl || false,
          uni: p.unidade || p.uni || 'un',
          desc: p.descricao || p.desc || '',
          emoji: p.emoji || '💊',
          ativo: p.ativo !== undefined ? p.ativo : true,
          qtd: p.estoque || p.qtd || 0
        };
      });
    }
  }).catch(function() {});
}
function loadPeds() {
  return apiFetch('/pedidos/admin/todos').then(function(res) {
    if (res.ok) {
      PEDS = Array.isArray(res.data) ? res.data : (res.data.pedidos || res.data.data || []);
      PEDS = PEDS.map(function(p) {
        var dt = p.created_at || p.createdAt || '';
        var hora = dt ? new Date(dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '--:--';
        return {
          id: p.id || p._id,
          num: p.numero || p.num || p.id,
          farm: p.farmacia_nome || p.farmacia || p.farm || '',
          cli: p.cliente_nome || p.cliente || p.cli || '',
          itens: p.quantidade_itens || p.itens || 0,
          total: p.total || p.valor_total || 0,
          status: p.status || 'pendente',
          metodo: p.metodo_pagamento || p.metodo || 'PIX',
          hora: hora
        };
      });
    }
  }).catch(function() {});
  // Atualizar badge de pedidos pendentes
  var pendentes = PEDS.filter(function(p){ return p.status === 'pendente' || p.status === 'confirmado'; }).length;
  var bdg = document.getElementById('bdg-ped');
  if (bdg) {
    if (pendentes > 0) {
      bdg.textContent = pendentes > 99 ? '99+' : pendentes;
      bdg.style.display = 'flex';
    } else {
      bdg.style.display = 'none';
    }
  }
}
function loadUsrs() {
  return apiFetch('/usuarios').then(function(res) {
    if (res.ok) {
      USRS = Array.isArray(res.data) ? res.data : (res.data.usuarios || res.data.users || res.data.data || []);
      USRS = USRS.map(function(u) {
        var dt = u.created_at || u.createdAt || '';
        return {
          id: u.id || u._id,
          nome: u.nome || u.name || '',
          email: u.email || '',
          role: u.role || 'cliente',
          tel: u.telefone || u.tel || '',
          dt: dt ? new Date(dt).toLocaleDateString('pt-BR') : '—',
          ativo: u.ativo !== undefined ? u.ativo : true
        };
      });
    }
  }).catch(function() {});
}
function loadCats() {
  return apiFetch('/app/categorias').then(function(res) {
    if (res.ok) {
      CATS = Array.isArray(res.data) ? res.data : (res.data.categorias || res.data.data || []);
    }
  }).catch(function() {});
}
function loadAll() {
  return Promise.all([loadFarms(), loadProds(), loadPeds(), loadUsrs(), loadCats()]);
}

// ── AUTH ──────────────────────────────────────────────────────
function doLogin() {
  var email = document.getElementById('lemail').value.trim();
  var senha = document.getElementById('lsenha').value;
  var btn = document.getElementById('lbtn');
  var err = document.getElementById('lerr');
  if (!email || !senha) { showErr('Preencha e-mail e senha.'); return; }
  btn.innerHTML = '<span class="spin"></span> Entrando...';
  btn.disabled = true;
  err.style.display = 'none';
  fetch(API + '/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, senha: senha})
  }).then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
  .then(function(res) {
    if (res.ok && res.data.user && (res.data.user.role === 'admin' || res.data.user.role === 'farmacia')) {
      AT = res.data.access || res.data.token || res.data.accessToken || null;
      CU = res.data.user;
      if (AT) localStorage.setItem('fly_at', AT);
      localStorage.setItem('fly_cu', JSON.stringify(CU));
      loadAll().then(function() { startApp(true); });
    } else {
      showErr(res.data.error || res.data.message || 'E-mail ou senha inválidos.');
      btn.innerHTML = 'Entrar'; btn.disabled = false;
    }
  }).catch(function() {
    showErr('Não foi possível conectar ao servidor. Tente novamente.');
    btn.innerHTML = 'Entrar'; btn.disabled = false;
  });
}

function showErr(msg) {
  var e = document.getElementById('lerr'); e.textContent = msg; e.style.display = 'block';
  var b = document.getElementById('lbtn'); b.innerHTML = 'Entrar'; b.disabled = false;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !document.getElementById('lp').classList.contains('hide')) doLogin();
});

// Verifica token salvo
window.addEventListener('load', function() {
  var savedAT = localStorage.getItem('fly_at');
  var savedCU = localStorage.getItem('fly_cu');
  if (!savedAT || !savedCU) return;
  try { CU = JSON.parse(savedCU); } catch(e) { localStorage.removeItem('fly_cu'); return; }
  AT = savedAT;
  // Valida token com a API e já recarrega os dados
  fetch(API + '/auth/me', {headers: {Authorization: 'Bearer ' + AT}})
  .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, status: r.status, data: d}; }); })
  .then(function(res) {
    var d = res.data;
    // Normaliza: suporta {role} direto ou {user: {role}}
    var user = (d && d.role) ? d : (d && d.user ? d.user : null);
    if (user && (user.role === 'admin' || user.role === 'farmacia')) {
      CU = user;
      AT = AT || res.data.access || res.data.token || AT;
      localStorage.setItem('fly_cu', JSON.stringify(CU));
      loadAll().then(function() { startApp(false); });
    } else if (res.status === 401) {
      // Token expirado de verdade
      localStorage.removeItem('fly_at');
      localStorage.removeItem('fly_cu');
      AT = null; CU = null;
    } else {
      // Outro erro (rede, 500) — usa dados salvos em cache
      loadAll().then(function() { startApp(false); });
    }
  }).catch(function() {
    // Sem rede: usa dados em cache do localStorage sem limpar sessão
    loadAll().then(function() { startApp(false); });
  });
});

function doLogout() {
  CU = null; AT = null;
  localStorage.removeItem('fly_at');
  localStorage.removeItem('fly_cu');
  document.getElementById('lp').classList.remove('hide');
  document.getElementById('app').style.display = 'none';
  document.getElementById('lbtn').innerHTML = 'Entrar';
  document.getElementById('lbtn').disabled = false;
  document.getElementById('lemail').value = 'admin@flypharma.com';
  document.getElementById('lsenha').value = 'admin123';
  document.getElementById('lerr').style.display = 'none';
}

function startApp(novoLogin) {
  document.getElementById('lp').classList.add('hide');
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sb-av').textContent = CU.nome[0].toUpperCase();

  var isAdm = CU.role === 'admin';
  document.getElementById('sb-role').className = 'sb-role ' + (isAdm ? 'adm' : 'frm');

  var html = '';
  for (var i = 0; i < nav.length; i++) {
    html += '<div class="sb-sec"><div class="sb-lbl">' + nav[i].g + '</div>';
    for (var j = 0; j < nav[i].items.length; j++) {
      var it = nav[i].items[j];

      html += '<div class="sb-item" id="nav-' + it.id + '" onclick="goto(\'' + it.id + '\')">';
      html += '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">' + ic + '</svg>';
      html += it.lbl;
      if (it.bdg) html += '<span class="sb-bdg" id="bdg-' + it.id + '" style="display:none">0</span>';
      html += '</div>';
    }
    html += '</div>';
  }
  document.getElementById('sb-nav').innerHTML = html;
  goto('dash');
  if (novoLogin) showToast('s', 'Bem-vindo, ' + CU.nome.split(' ')[0] + '!', 'Login realizado com sucesso.');
}

function goto(id) {
  document.querySelectorAll('.sb-item').forEach(function(e) { e.classList.remove('on'); });
  document.querySelectorAll('.page').forEach(function(e) { e.classList.remove('on'); });
  var ni = document.getElementById('nav-' + id);
  if (ni) ni.classList.add('on');
  var pg = document.getElementById('page-' + id);
  if (pg) pg.classList.add('on');
  document.getElementById('tb-title').textContent = PTL[id] || id;
  var actMap = {farm:'Nova farmácia',prod:'Novo produto',usr:'Novo usuário',ped:'',dash:'',est:'',rel:'',cfg:'',cham:''};
  var lbl = actMap[id] !== undefined ? actMap[id] : '';
  var ab = document.getElementById('act-btn');
  ab.style.display = lbl ? 'flex' : 'none';

  var loadMap = {farm: loadFarms, prod: loadProds, ped: loadPeds, usr: loadUsrs, est: loadProds, cham: loadChamados};

function renderPage(id) {
  if (id === 'dash') renderDash();
  else if (id === 'farm') renderFarm();
  else if (id === 'prod') renderProd();
  else if (id === 'ped')  renderPed();
  else if (id === 'est')  renderEst();
  else if (id === 'usr')  renderUsr();

  else if (id === 'cfg')  renderCfg();

}

function delFarm(id) {
  var f = FARMS.find(function(x){return x.id===id;});
  if (!f) return;
  if (!confirm('\u26A0\uFE0F Excluir a farm\u00E1cia "' + f.nome + '"?\n\nEsta a\u00E7\u00E3o \u00E9 irrevers\u00EDvel.')) return;
  if (!confirm('Confirmar exclus\u00E3o permanente de "' + f.nome + '"?')) return;
  apiFetch('/farmacias/' + id, {method: 'DELETE'})
  .then(function(res) {
    if (res.ok) {
      FARMS = FARMS.filter(function(x){return x.id !== id;});
      var el = document.getElementById('fc-' + id);
      if (el) {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0'; el.style.transform = 'scale(0.95)';
        setTimeout(function(){ el.remove(); updateFarmCounters(); }, 300);
      }
      showToast('s', 'Farm\u00E1cia exclu\u00EDda', '"' + f.nome + '" foi removida permanentemente.');
    } else {
      showToast('e', 'Erro ao excluir', res.data.error || res.data.message || 'Tente novamente');
    }
  }).catch(function(){ showToast('e', 'Sem conex\u00E3o', 'Verifique a conex\u00E3o.'); });
}

function updateFarmCounters() {
  var atv = FARMS.filter(function(x){return x.ativo;}).length;
  var inat = FARMS.filter(function(x){return !x.ativo;}).length;
  var fcs = document.querySelectorAll('#page-farm .fc');
  if (fcs[0]) fcs[0].textContent = 'Todas (' + FARMS.length + ')';
  if (fcs[1]) fcs[1].textContent = 'Ativas (' + atv + ')';
  if (fcs[2]) fcs[2].textContent = 'Inativas (' + inat + ')';
}

function filterFarm(q) {
  var data = FARMS.filter(function(f){return f.nome.toLowerCase().includes(q.toLowerCase());});
  document.getElementById('farm-grid').innerHTML = data.length ? data.map(farmCard).join('') : '<div class="empty"><div class="ei">🔍</div><div class="eT">Nenhuma farmácia encontrada</div></div>';
}
function filterFarmStatus(s, el) {
  el.closest('.fb').querySelectorAll('.fc').forEach(function(e){e.classList.remove('on');});
  el.classList.add('on');
  var data = s==='all' ? FARMS : s==='ativa' ? FARMS.filter(function(f){return f.ativo;}) : FARMS.filter(function(f){return !f.ativo;});
  document.getElementById('farm-grid').innerHTML = data.map(farmCard).join('');
}
function toggleFarm(id) {
  var f = FARMS.find(function(x){return x.id===id;});
  if (!f) return;
  var novoAtivo = !f.ativo;
  // Atualiza visualmente de imediato (optimistic)
  f.ativo = novoAtivo;
  var el = document.getElementById('fc-' + id);
  if (el) {
    var tmp = document.createElement('div');
    tmp.innerHTML = farmCard(f);
    el.parentNode.replaceChild(tmp.firstChild, el);
  }
  updateFarmCounters();
  // Salva no banco
  apiFetch('/farmacias/' + id, {
    method: 'PATCH',
    body: JSON.stringify({ativo: novoAtivo})
  }).then(function(res) {
    if (res.ok) {
      showToast(novoAtivo?'s':'w', novoAtivo?'Farmácia ativada':'Farmácia desativada', f.nome);
    } else {
      // Reverte se API retornou erro
      f.ativo = !novoAtivo;
      renderFarm();
      showToast('e', 'Erro ao salvar', res.data.error || res.data.message || 'Tente novamente');
    }
  }).catch(function() {
    f.ativo = !novoAtivo;
    renderFarm();
    showToast('e', 'Sem conexão', 'Não foi possível salvar. Verifique a conexão.');
  });
}

var ST_PROX = {pendente:'confirmado',confirmado:'preparando',preparando:'aguardando_entregador',aguardando_entregador:'em_entrega',em_entrega:'entregue'};
function avancarPed(id) {
  var p = PEDS.find(function(x){return x.id===id;});
  if (!p) return;
  var prox = ST_PROX[p.status];
  if (!prox) return;
  apiFetch('/pedidos/' + id, {method:'PATCH', body: JSON.stringify({status: prox})})
  .then(function(res) {
    if (res.ok) {
      p.status = prox;
      showToast('s','Pedido atualizado!','Status: ' + (SL[prox]||prox));
      renderPed();
    } else {
      showToast('e','Erro ao avançar', res.data.error || 'Tente novamente');
    }
  }).catch(function(){ showToast('e','Sem conexão','Verifique a conexão'); });
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(type, id) {
  MC = {type: type, id: id};
  var titles = {'farm-new':'Nova farmácia','farm-edit':'Editar farmácia','prod-new':'Novo produto','prod-edit':'Editar produto','usr-new':'Novo usuário','usr-edit':'Editar usuário','est-edit':'Ajustar estoque','ped-view':'Detalhes do pedido'};
  document.getElementById('m-title').textContent = titles[type] || type;
  document.getElementById('m-save-txt').textContent = type.indexOf('view') >= 0 ? 'Fechar' : 'Salvar';
  document.getElementById('m-overlay').classList.add('on');

  // Para farm-edit, busca horários atualizados do servidor
  if (type === 'farm-edit' && id) {
    document.getElementById('m-body').innerHTML = '<div style="padding:40px;text-align:center"><div class="spinner" style="width:32px;height:32px;border:3px solid var(--br);border-top-color:var(--t);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto"></div></div>';
    apiFetch('/farmacias/' + id).then(function(res) {
      if (res.ok && res.data) {
        // Atualiza FARMS local com horários novos
        var idx = FARMS.findIndex(function(f){ return f.id === id; });
        if (idx >= 0) FARMS[idx].horarios = res.data.horarios || [];
      }
      document.getElementById('m-body').innerHTML = buildMBody(type, id);
    }).catch(function() {
      document.getElementById('m-body').innerHTML = buildMBody(type, id);
    });
  } else {
    document.getElementById('m-body').innerHTML = buildMBody(type, id);
  }
}
function closeModal() { document.getElementById('m-overlay').classList.remove('on'); }
function closeModalOut(e) { if (e.target === document.getElementById('m-overlay')) closeModal(); }

function gv(id) { var el = document.getElementById(id); return el ? el.value : ''; }

    if (type === 'usr-new') h += '<div class="fr"><div class="fc3 full"><label>Senha *</label><input id="mu-senha" type="password" placeholder="••••••••"></div></div>';
    if (type === 'usr-edit') h += '<div class="fr"><div class="fc3 full"><label>Nova senha <span style="color:var(--t3);font-weight:400">(deixe em branco para não alterar)</span></label><input id="mu-nova-senha" type="password" placeholder="••••••••" autocomplete="new-password"></div></div>';

function saveModal() {
  if (MC.type === 'ped-view') { closeModal(); return; }
  if (MC.type === 'rsn') { salvarRedefinicaoSenha(); return; }
  var btn = document.getElementById('m-save-txt');
  btn.textContent = 'Salvando...';
  var type = MC.type, id = MC.id;

  if (type === 'farm-new') {
    var nome = gv('mf-nome'), cnpj = gv('mf-cnpj'), email = gv('mf-email'), senha = gv('mf-senha');
    if (!nome || !cnpj || !email || !senha) { showToast('e','Campos obrigatórios','Preencha: nome, CNPJ, e-mail e senha'); btn.textContent='Salvar'; return; }
    var cnpjRaw = cnpj.replace(/\D/g,'');
    if (!validateCNPJ(cnpjRaw)) { showToast('e','CNPJ inválido','Verifique os dígitos do CNPJ informado.'); btn.textContent='Salvar'; return; }
    var horariosPayload = [];
    for (var hd=0;hd<7;hd++) {
      horariosPayload.push({
        dia_semana: hd,
        hora_abertura: document.getElementById('mf-h-ab-'+hd) ? document.getElementById('mf-h-ab-'+hd).value : '08:00',
        hora_fechamento: document.getElementById('mf-h-fc-'+hd) ? document.getElementById('mf-h-fc-'+hd).value : '22:00',
        ativo: document.getElementById('mf-h-at-'+hd) ? document.getElementById('mf-h-at-'+hd).checked : true
      });
    }
    var payload = {
      nome: nome, cnpj: cnpj, email: email, senha: senha, role: 'farmacia',
      cidade: gv('mf-cidade'), bairro: gv('mf-bairro'), logradouro: gv('mf-end'),
      taxa_entrega: Number(gv('mf-taxa'))||6.90,
      raio_entrega_km: Number(gv('mf-raio'))||5,
      pedido_minimo: Number(gv('mf-pmin'))||0,
      aberta: gv('mf-aberta') === 'true'
    };
    apiFetch('/farmacias', {method:'POST', body: JSON.stringify(payload)})
    .then(function(res) {
      if (res.ok) {
        // Salva horários após criar farmácia
        apiFetch('/farmacias/' + res.data.id + '/horarios', {method:'PUT', body: JSON.stringify({horarios: horariosPayload})});
        closeModal();
        showToast('s','Farmácia cadastrada!', nome + ' — login: ' + email);
        loadFarms().then(function(){ renderFarm(); });
      } else {
        showToast('e','Erro ao cadastrar', res.data.error || res.data.message || 'Tente novamente');
        btn.textContent = 'Salvar';
      }
    }).catch(function(){ showToast('e','Sem conexão','Verifique a conexão'); btn.textContent='Salvar'; });

  } else if (type === 'farm-edit') {
    var fe = {
      nome: gv('mf-nome'), cidade: gv('mf-cidade'), bairro: gv('mf-bairro'),
      logradouro: gv('mf-end'), taxa_entrega: Number(gv('mf-taxa'))||6.90,
      raio_entrega_km: Number(gv('mf-raio'))||5,
      pedido_minimo: Number(gv('mf-pmin'))||0,
      aberta: gv('mf-aberta') === 'true'
    };
    var horariosEdit = [];
    for (var hde=0;hde<7;hde++) {
      horariosEdit.push({
        dia_semana: hde,
        hora_abertura: document.getElementById('mf-h-ab-'+hde) ? document.getElementById('mf-h-ab-'+hde).value : '08:00',
        hora_fechamento: document.getElementById('mf-h-fc-'+hde) ? document.getElementById('mf-h-fc-'+hde).value : '22:00',
        ativo: document.getElementById('mf-h-at-'+hde) ? document.getElementById('mf-h-at-'+hde).checked : true
      });
    }
    apiFetch('/farmacias/' + id, {method:'PATCH', body: JSON.stringify(fe)})
    .then(function(res) {
      if (res.ok) {
        // Salva horários e aguarda resposta
        return apiFetch('/farmacias/' + id + '/horarios', {method:'PUT', body: JSON.stringify({horarios: horariosEdit})})
          .then(function(hRes) {
            closeModal();
            if (hRes.ok) {
              showToast('s','Farmácia atualizada!', fe.nome + ' — horários salvos');
            } else {
              showToast('s','Farmácia atualizada!', fe.nome);
              console.warn('Erro ao salvar horários:', hRes.data);
            }
            loadFarms().then(function(){ renderFarm(); });
          });
      } else {
        showToast('e','Erro ao salvar', res.data.error || res.data.message || 'Tente novamente');
        btn.textContent = 'Salvar';
      }
    }).catch(function(e){ console.error(e); showToast('e','Sem conexão','Verifique a conexão'); btn.textContent='Salvar'; });

  } else if (type === 'prod-new') {
    var pNome = gv('mp-nome'), pPreco = gv('mp-preco');
    if (!pNome || !pPreco) { showToast('e','Obrigatório','Nome e preço são obrigatórios'); btn.textContent='Salvar'; return; }
    var mpFarm = gv('mp-farm');
    if (!mpFarm) { showToast('e','Obrigatório','Selecione a farmácia'); btn.textContent='Salvar'; return; }
    var pp = {
      nome: pNome, laboratorio: gv('mp-lab'), categoria_id: gv('mp-cat') || null,
      farmacia_id: mpFarm,
      preco: Number(pPreco), preco_promocional: Number(gv('mp-promo'))||null,
      controlado: gv('mp-ctrl')==='true', unidade: gv('mp-uni'),
      descricao: gv('mp-desc'), estoque: Number(gv('mp-qtd'))||0
    };
    apiFetch('/produtos', {method:'POST', body: JSON.stringify(pp)})
    .then(function(res) {
      if (res.ok) {
        closeModal(); showToast('s','Produto cadastrado!', pNome);
        loadProds().then(function(){ renderProd(); });
      } else {
        showToast('e','Erro ao cadastrar', res.data.error || res.data.message || 'Tente novamente');
        btn.textContent = 'Salvar';
      }
    }).catch(function(){ showToast('e','Sem conexão','Verifique a conexão'); btn.textContent='Salvar'; });

  } else if (type === 'prod-edit') {
    var pe = {
      nome: gv('mp-nome'), laboratorio: gv('mp-lab'), categoria_id: gv('mp-cat') || null,
      farmacia_id: gv('mp-farm'),
      preco: Number(gv('mp-preco')), preco_promocional: Number(gv('mp-promo'))||null,
      controlado: gv('mp-ctrl')==='true', unidade: gv('mp-uni'),
      descricao: gv('mp-desc'), estoque: Number(gv('mp-qtd'))||0
    };
    apiFetch('/produtos/' + id, {method:'PATCH', body: JSON.stringify(pe)})
    .then(function(res) {
      if (res.ok) {
        closeModal(); showToast('s','Produto atualizado!', pe.nome);
        loadProds().then(function(){ renderProd(); });
      } else {
        showToast('e','Erro ao salvar', res.data.error || res.data.message || 'Tente novamente');
        btn.textContent = 'Salvar';
      }
    }).catch(function(){ showToast('e','Sem conexão','Verifique a conexão'); btn.textContent='Salvar'; });

  } else if (type === 'usr-new') {
    var uNome=gv('mu-nome'), uEmail=gv('mu-email'), uSenha=gv('mu-senha'), uRole=gv('mu-role');
    if (!uNome||!uEmail||!uSenha) { showToast('e','Obrigatório','Nome, e-mail e senha são obrigatórios'); btn.textContent='Salvar'; return; }
    apiFetch('/auth/register', {method:'POST', body: JSON.stringify({nome:uNome,email:uEmail,senha:uSenha,role:uRole,telefone:gv('mu-tel')})})
    .then(function(res) {
      if (res.ok) {
        closeModal(); showToast('s','Usuário criado!', uNome + ' — ' + uRole);
        loadUsrs().then(function(){ renderUsr(); });
      } else {
        showToast('e','Erro ao criar', res.data.error || res.data.message || 'Tente novamente');
        btn.textContent = 'Salvar';
      }

// ── CNPJ — Máscara e Validação ────────────────────────────────
function cnpjMask(v) {
  v = (v||'').replace(/\D/g,'').slice(0,14);
  if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,'$1.$2.$3/$4-$5');
  else if (v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/,'$1.$2.$3/$4');
  else if (v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d{0,3}).*/,'$1.$2.$3');
  else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,3}).*/,'$1.$2');
  return v;
}
function maskCNPJ(input) {
  input.value = cnpjMask(input.value);
  validateCNPJField(input);
}
function validateCNPJ(cnpj) {
  cnpj = cnpj.replace(/\D/g,'');
  if (cnpj.length !== 14) return false;
  if (/^(\d)\1+$/.test(cnpj)) return false;
  var calc = function(cnpj, n) {
    var sum = 0, pos = n - 7;
    for (var i = n; i >= 1; i--) {
      sum += parseInt(cnpj.charAt(n - i)) * pos--;
      if (pos < 2) pos = 9;
    }
    var r = sum % 11 < 2 ? 0 : 11 - sum % 11;
    return r === parseInt(cnpj.charAt(n));
  };
  return calc(cnpj, 12) && calc(cnpj, 13);
}
function validateCNPJField(input) {
  var ic = document.getElementById('cnpj-ic');
  if (!ic) return;
  var raw = input.value.replace(/\D/g,'');
  if (raw.length === 0) { ic.textContent=''; input.style.borderColor=''; return; }
  if (raw.length < 14) { ic.textContent=''; input.style.borderColor='var(--a)'; return; }
  if (validateCNPJ(raw)) {
    ic.textContent='✅'; input.style.borderColor='var(--g)';
    input.dataset.valid='1';
  } else {
    ic.textContent='❌'; input.style.borderColor='var(--r)';
    input.dataset.valid='0';
  }
}

function previewCSV(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var rows = parseCSV(text);
    if (!rows.length) { document.getElementById('csv-preview').innerHTML = '<p style="color:var(--r)">Arquivo vazio ou inválido.</p>'; return; }
    var header = rows[0].map(function(h){ return h.toLowerCase().trim(); });
    var data = rows.slice(1).filter(function(r){ return r.some(function(c){ return c.trim(); }); });
    var h = '<div style="font-size:12px;font-weight:600;color:var(--g);margin-bottom:8px">✅ ' + data.length + ' produto(s) encontrado(s)</div>';
    h += '<div style="overflow-x:auto;max-height:220px;overflow-y:auto;border:1px solid var(--br);border-radius:8px">';
    h += '<table class="tbl"><thead><tr>';
    header.forEach(function(col){ h += '<th>' + col + '</th>'; });
    h += '</tr></thead><tbody>';
    data.slice(0,8).forEach(function(row){
      h += '<tr>';
      row.forEach(function(cell){ h += '<td style="font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + cell + '">' + cell + '</td>'; });
      h += '</tr>';
    });
    if (data.length > 8) h += '<tr><td colspan="' + header.length + '" style="text-align:center;font-size:11px;color:var(--t3)">... e mais ' + (data.length-8) + ' linha(s)</td></tr>';
    h += '</tbody></table></div>';
    document.getElementById('csv-preview').innerHTML = h;
    window._csvData = {header: header, rows: data};
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  // Normalizar quebras de linha (Windows \r\n e Mac \r)
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  // Detectar separador pela primeira linha
  var firstLine = text.split('\n')[0] || '';
  var commas = (firstLine.match(/,/g) || []).length;
  var semis  = (firstLine.match(/;/g) || []).length;
  var sep = semis > commas ? ';' : ',';
  console.log('[CSV] sep:', JSON.stringify(sep), 'commas:', commas, 'semis:', semis, 'header:', firstLine.slice(0,80));
  return text.split('\n').filter(function(l){ return l.trim(); }).map(function(line){
    var result = [], cur = '', inQ = false;
    for (var i=0; i<line.length; i++) {
      var c = line[i];
      if (c==='"') { inQ=!inQ; continue; }
      if (c===sep && !inQ) { result.push(cur.trim()); cur=''; continue; }
      cur += c;
    }
    result.push(cur.trim());
    return result;
  });
}

function importCSVExecutar(farmId, csvSnapshot) {
  var header = csvSnapshot.header;
  var rows = csvSnapshot.rows;
  // Toast de progresso
  showToast('i', 'Importando...', 'Aguarde, enviando ' + rows.length + ' produtos.');

  // Mapear colunas automaticamente
  var colMap = {
    nome: findCol(header, ['nome','name','produto','medicamento','descricao_produto']),
    lab:  findCol(header, ['laboratorio','fabricante','lab','manufacturer']),
    cat:  findCol(header, ['categoria','category','classe','tipo']),
    preco: findCol(header, ['preco','price','valor','preco_venda','venda']),
    ctrl: findCol(header, ['controlado','controlled','receita','tarja']),
    uni:  findCol(header, ['unidade','unit','uni','apresentacao']),
    desc: findCol(header, ['descricao','description','obs','observacao']),
    estoque: findCol(header, ['estoque','quantidade','qty','stock','qtd'])
  };

  // Log para diagnóstico
  console.log('[CSV] header:', header);
  console.log('[CSV] colMap:', colMap);
  console.log('[CSV] total rows bruto:', rows.length);
  console.log('[CSV] farmId:', farmId);
  console.log('[CSV] primeira row:', rows[0]);

  var produtos = rows.map(function(row) {
    var nome = getCol(row, colMap.nome);
    var preco = parseFloat((getCol(row, colMap.preco)||'10').replace(',','.'));
    if (isNaN(preco) || preco <= 0) preco = 10.00;
    return {
      farmacia_id:  farmId,
      nome:         nome || '',
      laboratorio:  getCol(row, colMap.lab),
      categoria:    getCol(row, colMap.cat),
      preco:        preco,
      controlado:   /sim|yes|s|1|tarja/i.test(getCol(row, colMap.ctrl)||''),
      unidade:      getCol(row, colMap.uni) || 'cx',
      descricao:    getCol(row, colMap.desc),
      estoque:      parseInt(getCol(row, colMap.estoque)) || 0,
      principio_ativo: getCol(row, findCol(header, ['principio_ativo','principio','ativo','pa']))
    };
  }).filter(function(p){ return p.nome && p.nome.length > 1; });

  console.log('[CSV] produtos válidos após filter:', produtos.length);
  if (produtos.length === 0) {
    showToast('e','CSV sem dados válidos','Verifique se a coluna "nome" existe no arquivo.');
    btn.textContent = 'Importar';
    return;
  }
  console.log('[CSV] exemplo produto[0]:', produtos[0]);

  // Enviar em lotes de 50
  var lotes = [];
  for (var i=0; i<produtos.length; i+=50) lotes.push(produtos.slice(i,i+50));
  console.log('[CSV] total lotes:', lotes.length);

  var ok=0, erros=0;
  var next = function(idx) {
    if (idx >= lotes.length) {
      showToast(ok>0?'s':'w', 'Importação concluída!', ok + ' produto(s) importado(s)' + (erros?' · '+erros+' com erro':''));
      loadProds().then(function(){ renderProd(); });
      return;
    }
    console.log('[CSV] enviando lote', idx+1, '/', lotes.length, '—', lotes[idx].length, 'itens');
    apiFetch('/produtos/importar', {
      method: 'POST',
      body: JSON.stringify({produtos: lotes[idx]})
    }).then(function(res) {
      console.log('[CSV] lote', idx+1, 'resposta:', res.status, res.data);
      if (res.ok) {
        ok += (res.data.criados || lotes[idx].length);
      } else {
        erros += lotes[idx].length;
        var errMsg = res.data && res.data.error ? res.data.error : ('HTTP ' + res.status + ' — verifique o backend');
        showToast('e', 'Erro lote ' + (idx+1), errMsg);
        if (idx === 0) { return; }
      }
      next(idx+1);
    }).catch(function(e){
      console.error('[CSV] catch lote', idx+1, e);
      erros += lotes[idx].length;
      next(idx+1);
    });
  };
  next(0);
}

function findCol(header, names) {
  for (var i=0; i<names.length; i++) {
    var idx = header.indexOf(names[i]);
    if (idx !== -1) return idx;
  }
  return -1;
}
function getCol(row, idx) {
  return idx !== -1 && row[idx] ? row[idx].trim() : '';
}

function salvarNovaSenha() {
  var atual  = document.getElementById('cfg-senha-atual')  ? document.getElementById('cfg-senha-atual').value  : '';
  var nova   = document.getElementById('cfg-nova-senha')   ? document.getElementById('cfg-nova-senha').value   : '';
  var conf   = document.getElementById('cfg-conf-senha')   ? document.getElementById('cfg-conf-senha').value   : '';
  var msg    = document.getElementById('cfg-senha-msg');

  if (!atual || !nova || !conf) { setMsg(msg,'e','Preencha todos os campos.'); return; }
  if (nova.length < 6)          { setMsg(msg,'e','A nova senha deve ter pelo menos 6 caracteres.'); return; }
  if (nova !== conf)             { setMsg(msg,'e','As senhas não coincidem.'); return; }

  setMsg(msg,'i','Salvando...');
  apiFetch('/auth/reset-senha', {
    method: 'POST',
    body: JSON.stringify({senha_atual: atual, nova_senha: nova})
  }).then(function(res) {
    if (res.ok) {
      setMsg(msg,'s','✅ Senha alterada com sucesso!');
      document.getElementById('cfg-senha-atual').value = '';
      document.getElementById('cfg-nova-senha').value  = '';
      document.getElementById('cfg-conf-senha').value  = '';
      showToast('s','Senha alterada!','Novo acesso válido no painel e no app.');
    } else {
      setMsg(msg,'e', res.data.error || 'Erro ao alterar senha.');
    }
  }).catch(function(){ setMsg(msg,'e','Sem conexão. Tente novamente.'); });
}
function setMsg(el, type, text) {
  if (!el) return;
  var colors = {s:'var(--g)', e:'var(--r)', i:'var(--t2)', w:'var(--a)'};
  el.style.color = colors[type] || 'var(--t2)';
  el.textContent = text;
}

  sb.classList.remove('open');
  if (ov) ov.classList.remove('on');
  document.body.style.overflow = '';
}
// Fechar sidebar ao navegar (mobile)
var _origGoto = goto;
goto = function(id) {
  if (window.innerWidth <= 768) closeSidebar();
  _origGoto(id);
};

</script>
</body>
